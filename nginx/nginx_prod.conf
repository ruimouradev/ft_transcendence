# nginx/nginx.conf

map $cookie_access_token $token_rate_limit_key {
    default $cookie_access_token;
    ""      $binary_remote_addr;
}

# Define Rate Limit Zone: 10MB memory (~160,000 keys), 10 requests/sec average
limit_req_zone $token_rate_limit_key zone=api_token_limit:10m rate=10r/s;

limit_req_zone $binary_remote_addr zone=ip_strict_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ip_strict_password_limit:10m rate=1r/m;
# Return HTTP 429 when rate limit is exceeded
limit_req_status 429;

# upstream frontend_server {
#     server frontend:5173;
# }

upstream backend_server {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;
    
    # force HTTPS redirection
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/transcendence.crt;
    ssl_certificate_key /etc/nginx/ssl/transcendence.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Custom JSON Response for Rate Limit Exceeded (HTTP 429)
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"detail": "Rate limit exceeded. Please wait before retrying."}';
    }

    # 1. frontend reverse proxy
    location / {
        root /usr/share/nginx/html;
        index index.html;

        try_files $uri $uri/ /index.html;
    }
    # location / {
    #     proxy_pass http://frontend_server;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;

    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "Upgrade";

    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    # }

    # 2. backend API reverse proxy with rate limiting based on access_token cookie
    location /api/v1/auth/ {
        limit_req zone=ip_strict_limit burst=3 nodelay;
            
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/request-password-reset {
        limit_req zone=ip_strict_password_limit nodelay;
            
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/users/ {
        limit_req zone=ip_strict_limit burst=5 nodelay;
            
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_token_limit burst=30 nodelay;

        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # backend api documentation
    location /docs {
        proxy_pass http://backend_server/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static {
        proxy_pass http://backend_server/static;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. backend WebSocket reverse proxy
    location /ws {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # # adminer
    # location /adminer {
    #     proxy_pass http://adminer:8080/;
        
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;

    #     proxy_redirect http:// $scheme://;
    # }
}